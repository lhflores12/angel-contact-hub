<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel Rabago | M3 Digital Agency</title>
<style>
  :root {
    --navy: #0e1f39;
    --navy-light: #16294a;
    --gold: #cf9a4b;
    --white: #f7f6f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--navy);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    max-width: 460px;
    padding: 40px 24px 32px;
  }
  .ribbon {
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 30px;
    margin: 0 0 4px;
    font-weight: 700;
    color: var(--white);
  }
  .subtitle {
    font-size: 15px;
    color: var(--gold);
    margin: 0 0 28px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .contact-block {
    background: var(--navy-light);
    border: 1px solid rgba(207,154,75,0.25);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .contact-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    text-decoration: none;
    color: var(--white);
    font-size: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .contact-row:last-child { border-bottom: none; }
  .contact-row .icon {
    width: 20px;
    text-align: center;
    color: var(--gold);
    font-size: 16px;
  }
  .save-btn {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--gold);
    color: var(--navy);
    font-weight: 700;
    font-size: 16px;
    padding: 15px 0;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    margin-bottom: 32px;
  }
  .divider {
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(247,246,243,0.55);
    margin: 0 0 16px;
  }
  .site-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--navy-light);
    border: 1px solid rgba(207,154,75,0.25);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    text-decoration: none;
    color: var(--white);
  }
  .site-card img {
    width: 52px;
    height: 52px;
    object-fit: contain;
    border-radius: 8px;
    background: #fff;
    padding: 4px;
    flex-shrink: 0;
  }
  .site-card .site-text { flex: 1; }
  .site-card .site-name {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .site-card .site-tag {
    font-size: 12.5px;
    color: rgba(247,246,243,0.65);
  }
  .site-card .arrow {
    color: var(--gold);
    font-size: 20px;
  }
  footer {
    margin-top: 28px;
    text-align: center;
    font-size: 11.5px;
    color: rgba(247,246,243,0.45);
    line-height: 1.6;
  }
</style>
</head>
